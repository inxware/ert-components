# Board-specific Kconfig overrides for nRF5340 DK (application core).
# Supplements prj.conf.

# CONFIG_UART_0_NRF_UARTE was removed in Zephyr 4.x; UARTE is selected
# automatically when CONFIG_SERIAL=y on Nordic SoCs.
CONFIG_UART_INTERRUPT_DRIVEN=y

# nRF5340 cpuapp has more RAM; allow a larger main thread stack
CONFIG_MAIN_STACK_SIZE=4096
