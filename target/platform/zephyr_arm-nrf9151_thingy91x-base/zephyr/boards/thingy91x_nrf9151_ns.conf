# Board-specific Kconfig for Nordic Thingy:91 X (nRF9151 app core), shared by
# every variant in this family. Inherited via ERT_ZEPHYR_BASE_PLATFORM; a
# variant that needs different values ships a file of the same name, which is
# layered on top by scripts/zephyr_cmake_gen.py.
#
# BOARD .conf MERGES AFTER prj.conf AND WINS. Anything set here overrides what
# a platform config.mk or a shared *_nrf7x/nrf91.mk fragment put in prj.conf,
# silently. Keep this file to things that are genuinely board-level and true
# for all variants; put radio and feature choices in the config.mk chain where
# the override order is visible.

# CONFIG_UART_0_NRF_UARTE was removed in Zephyr 4.x / NCS 3.x; UARTE is selected
# automatically when CONFIG_SERIAL=y on Nordic SoCs.
CONFIG_UART_INTERRUPT_DRIVEN=y

# NOTE: CONFIG_NRF_MODEM_LIB is deliberately NOT set here. It lives in the base
# config.mk's ERT_ZEPHYR_KCONFIG (=n) so the cellular variant can turn it on
# through the normal, visible override order. Setting it in this file would
# make that impossible — see the merge-order warning above.
