# Static partition layout for thingy91x/nrf9151/ns (TF-M non-secure build).
# Base copied verbatim from the NCS board default
#   nrf/boards/nordic/thingy91x/thingy91x_nrf9151_pm_static.yml
# (the TF-M-inclusive variant - required for CONFIG_WIFI_NRF70 to actually
# resolve to y; the secure/no-TF-M variant this file used to be based on
# leaves it silently unset despite satisfied devicetree deps)
# and EXTENDED with `littlefs_storage` (1 MB, external flash) for the eRT SODL
# app filesystem. Forced onto the build via -DPM_STATIC_YML_FILE in
# zephyr_build.sh (otherwise the board default wins). Free external flash starts
# at 0x4D2000 (after settings_storage 0x4D0000+0x2000) - unchanged from the
# no-TF-M layout since TF-M only affects internal flash_primary partitioning.
b0:
  address: 0x0
  size: 0x8000
  region: flash_primary
b0_container:
  address: 0x0
  size: 0x8000
  region: flash_primary
  span: [b0]
s0:
  address: 0x8000
  size: 0x14000
  span: [mcuboot, s0_pad]
  region: flash_primary
s0_pad:
  address: 0x8000
  size: 0x200
  share_size: [mcuboot_pad]
  region: flash_primary
s0_image:
  address: 0x8200
  size: 0x13e00
  span: [mcuboot]
  region: flash_primary
mcuboot:
  address: 0x8200
  size: 0x13e00
  region: flash_primary
s1:
  address: 0x1c000
  size: 0x14000
  span: [s1_pad, s1_image]
  region: flash_primary
s1_pad:
  address: 0x1c000
  size: 0x200
  region: flash_primary
  share_size: [mcuboot_pad]
s1_image:
  address: 0x1c200
  size: 0x13e00
  share_size: [mcuboot]
  region: flash_primary
mcuboot_primary:
  address: 0x30000
  size: 0xD0000
  span: [mcuboot_pad, app, tfm]
  region: flash_primary
tfm_secure:
  # Grown from the NCS default 0x8000 (32256 B) - the actual TF-M secure image
  # for this Kconfig combo needs 64372 B, overflowing the default by 32116 B.
  # 0x18000 = mcuboot_pad(0x200) + tfm(0x17e00), with `app` shrunk by the same
  # amount below so mcuboot_primary's total size is unchanged. Sized so the
  # non-secure (app) start address 0x48000 lands on the 32 KB SPU-region
  # boundary nRF91 requires (tfm's own end address doesn't need alignment,
  # only where the non-secure region begins).
  address: 0x30000
  size: 0x18000
  span: [mcuboot_pad, tfm]
  region: flash_primary
mcuboot_pad:
  address: 0x30000
  size: 0x200
  region: flash_primary
mcuboot_primary_app:
  address: 0x30200
  size: 0xcfe00
  span: [tfm, app]
  region: flash_primary
app_image:
  address: 0x30200
  size: 0xcfe00
  span: [tfm, app]
  region: flash_primary
tfm:
  address: 0x30200
  size: 0x17e00
  region: flash_primary
tfm_nonsecure:
  address: 0x48000
  size: 0xb8000
  span: [app]
  region: flash_primary
app:
  address: 0x48000
  size: 0xb8000
  region: flash_primary

mcuboot_secondary:
  device: DT_CHOSEN(nordic_pm_ext_flash)
  address: 0x0
  size: 0xD0000
  share_size: [mcuboot_primary]
  region: external_flash
fmfu_storage:
  address: 0xD0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x400000
settings_storage:
  device: DT_CHOSEN(nordic_pm_ext_flash)
  address: 0x4D0000
  size: 0x2000
  region: external_flash
littlefs_storage:
  device: DT_CHOSEN(nordic_pm_ext_flash)
  address: 0x4D2000
  size: 0x100000
  region: external_flash
