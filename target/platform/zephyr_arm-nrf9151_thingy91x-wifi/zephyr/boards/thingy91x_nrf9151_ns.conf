# Wi-Fi variant board Kconfig. Layered on top of the base platform's file of
# the same name (see ERT_ZEPHYR_BASE_PLATFORM in this variant's config.mk) —
# this file REPLACES it wholesale, so the base's contents are repeated here.

# CONFIG_UART_0_NRF_UARTE was removed in Zephyr 4.x / NCS 3.x; UARTE is selected
# automatically when CONFIG_SERIAL=y on Nordic SoCs.
CONFIG_UART_INTERRUPT_DRIVEN=y

# CONFIG_MAIN_STACK_SIZE is set in target/os-arch/zephyr-arm/wifi_nrf70.mk
# (needed for the net stack / wpa_supplicant). This board conf merges AFTER
# prj.conf, so setting it here would silently win. Don't.

# The nRF91 modem library does not fit alongside the nRF70 Wi-Fi stack:
# "region RAM overflowed by 57076 bytes", measured. The base config.mk already
# sets this =n in prj.conf; it is repeated here as a hard guarantee for the one
# variant where enabling it is catastrophic rather than merely wasteful.
# The cellular sibling has no board .conf and therefore never sees this line.
CONFIG_NRF_MODEM_LIB=n
