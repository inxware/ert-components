# Board-specific Kconfig overrides for RAK4631 (nRF52840).
# This file supplements prj.conf; it is picked up automatically by west build
# when -b rak4631 is specified.  The board's own Kconfig already sets many
# nRF52840 defaults; only add genuine overrides here.

# UART_0_NRF_UARTE was removed in Zephyr v3+; UARTE selection is now
# done via device tree (the rak4631 board DTS already uses UARTE).
CONFIG_UART_INTERRUPT_DRIVEN=y
