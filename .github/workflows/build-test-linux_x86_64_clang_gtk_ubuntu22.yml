name: build-test-linux_x86_64_clang_gtk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
     container:
      image: inxware/inx-debian10-clang10
 #     options: --user root
 #     credentials:
 #       username: ${{ secrets.DOCKERHUB_USERNAME }}
 #       password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - uses: actions/checkout@v3
      with:
        path: ert-components
    - name: Checkout tools repo
      uses: actions/checkout@v3
      with:
        repository: inxware/ert-build-support
        path: ert-build-support
        ref: refs/heads/main
        lfs: true
    - name: Checkout contrib middleware repo
      uses: actions/checkout@v3
      with:
        repository: inxware/ert-contrib-middleware
        path: ert-contrib-middleware
        ref: refs/heads/main
        lfs: true

    - name: configure 
      run: | 
           cd ert-components
           ./configure linux_x86_64_clang_gtk
    - name: make
      run: |
           cd ert-components
           pwd
           make -j 8     
    - name: make targetenv
      run: |
           cd ert-components
           pwd
           make targetenv
    - name: make package
      run: |
           cd ert-components
           pwd
           make targetenv_deb
