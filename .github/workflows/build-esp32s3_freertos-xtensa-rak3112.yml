name: build-esp32s3_freertos-xtensa-rak3112

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# RAK3112 (ESP32-S3 + SX1262 LoRa, 8 MB flash / 8 MB PSRAM). Distinct from the
# generic esp32s3 job in two ways that matter to the checkouts below: it uses
# the image (see the container comment) and its contrib key, which carries the
# n8r8 memory variant. Default app is demos/lorawan, in the published apps set.

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      # NOT inxware/esp32s3_ubuntu22.04-build-essential, which the platform's
      # Dockerimagename names: it ships git 2.25.1 and actions/checkout needs
      # >= 2.28 for sparse-checkout, so every dependency checkout fails before
      # the build starts. Both images are generic build-essential (neither bakes
      # ESP-IDF; the toolchain comes from ert-build-support), and this one
      # already builds an esp32s3 target in the sibling workflow. The esp32s3
      # image wants its git refreshed or retiring.
      image: inxware/esp32_ubuntu22.04-build-essential
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        path: ert-components

    - name: Checkout ert build support repo
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-build-support
        fetch-depth: 1
        path: ert-build-support
        sparse-checkout: |
            toolchains/x86_64/xtensa-esp32s3-elf-5.1
            # esptool, needed by 'make targetenv_package'. Not part of the s3
            # toolchain: targetenv_esp32_sdk-packager_paths.sh maps every ESP
            # toolchain to this one copy of the flashing tools, since it is the
            # only one in ert-build-support.
            #
            # BOTH paths are required. The first is a SYMLINK
            #   xtensa-esp32-elf-4.4.1/espressif-4.4.1 -> ../espressif-4.4.1
            # and sparse-checkout materialises the link but not its target, so
            # checking out only that one leaves it dangling and esptool is
            # "can't open file". The second is the real 84 MB directory.
            toolchains/x86_64/xtensa-esp32-elf-4.4.1/espressif-4.4.1
            toolchains/x86_64/espressif-4.4.1
            support_libs/target_libs/xtensa-esp32s3_freertos
        ref: refs/heads/main
        lfs: true

    - name: Checkout ert-kernels
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-kernels
        fetch-depth: 1
        path: ert-kernels
        sparse-checkout: xtensa-esp32s3_freertos/kernel
        ref: refs/heads/main

    - name: Checkout ert-contrib-middleware
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-contrib-middleware
        fetch-depth: 1
        path: ert-contrib-middleware
        sparse-checkout: target_libs/xtensa-esp32s3_freertos_n8r8-xtensa-esp32s3-elf-5.1
        ref: refs/heads/main
        lfs: true

    - name: Checkout apps
      uses: actions/checkout@v4
      with:
        repository: inxware/apps
        fetch-depth: 1
        path: apps
        ref: refs/heads/RELEASE-PRODUCTION

    # Both variants in one job: they share every checkout above, so a second
    # job would re-fetch the toolchain and contrib for nothing. The headless
    # variant is the shipping LoRa configuration; -lvgl adds an ft81x display.
    - name: Build rak3112 (headless)
      run: |
           cd ert-components
           ./configure esp32s3_freertos-xtensa-rak3112
           make -j 8
           make targetenv
           make targetenv_package

    - name: Build rak3112-lvgl (ft81x display)
      run: |
           cd ert-components
           make clean
           ./configure esp32s3_freertos-xtensa-rak3112-lvgl
           make -j 8
           make targetenv
           make targetenv_package

    - name: Both binaries present
      run: |
           for t in esp32s3_freertos-xtensa-rak3112 esp32s3_freertos-xtensa-rak3112-lvgl; do
             ls -l "TARGET_TREES/ehs_env-$t/bin/ehs.exe"
           done
