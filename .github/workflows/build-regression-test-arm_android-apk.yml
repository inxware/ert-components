name: build-linux_android_arm64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      image: inxware/inx-debian10-clang10
    steps:
    - uses: actions/checkout@v3
      with:
        path: ert-components

    - name: Checkout ert build support repo
      uses: actions/checkout@v3
      with:
        repository: inxware/ert-build-support
        path: ert-build-support
        ref: refs/heads/main
        lfs: true

    - name: configure
      run: |
           cd ert-components
           ./configure linux_android_arm64
    - name: make
      run: |
           cd ert-components
           pwd
           make -j 8
    - name: make targetenv
      run: |
           cd ert-components
           pwd
           make targetenv
    - name: make package
      run: |
           cd ert-components
           pwd
           make targetenv_deb
