name: build-win_x86_32-lucid-win10

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      image: inxware/ubuntu22.04-build-essential-mingw
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        path: ert-components

    - name: Checkout ert build support repo
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
            support_libs/target_libs/i686-mingw32posix
        repository: inxware/ert-build-support
        path: ert-build-support
        ref: refs/heads/main
        lfs: true

    - name: Checkout ert-contrib-middleware
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-contrib-middleware
        path: ert-contrib-middleware
        sparse-checkout: target_libs/i686-mingw32posix_sdl2-ffmpeg
        ref: refs/heads/main
        lfs: true

    - name: Checkout apps
      uses: actions/checkout@v4
      with:
        repository: inxware/apps
        path: apps
        ref: refs/heads/RELEASE-PRODUCTION

    - name: configure
      run: |
           cd ert-components
           ./configure win_x86_32-lucid-win10

    - name: make
      run: |
           cd ert-components
           pwd
           make -j 8

    - name: make targetenv
      run: |
           cd ert-components
           pwd
           make targetenv

    - name: make package
      run: |
           cd ert-components
           pwd
#          make targetenv_nsis
