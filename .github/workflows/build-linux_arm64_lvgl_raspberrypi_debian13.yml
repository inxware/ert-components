name: build-linux_arm64_lvgl_raspberrypi_debian13

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Raspberry Pi 5 / Debian 13, LVGL, with machine learning enabled:
#   EHS_ML_IE_IMAGE_SUPPORT=tensorflow-lite   inference engine
#   EHS_ML_HARDWARE_ACCELERATION=hailo        accelerator
# Both are the one target, so this single job covers TFLite and Hailo. There is
# a separate linux_arm64_lvgl_raspberrypi_demo_hailo, but it pins
# EHS_DEFAULT_APP=hardware-demos/rpi-hailo and hardware-demos is not part of the
# published apps set, so it cannot build on a public runner.

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      image: inxware/inx-raspbian13-arm64
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        path: ert-components

    - name: Checkout ert-kernels
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-kernels
        fetch-depth: 1
        path: ert-kernels
        sparse-checkout: arm64-linux-gnu-clang19_debian13/kernel
        ref: refs/heads/main

    - name: Checkout ert-contrib-middleware
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-contrib-middleware
        fetch-depth: 1
        path: ert-contrib-middleware
        sparse-checkout: target_libs/arm64-linux-gnu-clang19_debian13_base
        ref: refs/heads/main
        lfs: true

    - name: Checkout apps
      uses: actions/checkout@v4
      with:
        repository: inxware/apps
        fetch-depth: 1
        path: apps
        ref: refs/heads/RELEASE-PRODUCTION

    - name: configure
      run: |
           cd ert-components
           ./configure linux_arm64_lvgl_raspberrypi_debian13

    - name: make
      run: |
           cd ert-components
           make -j 8

    - name: make targetenv
      run: |
           cd ert-components
           make targetenv

    - name: make package
      run: |
           cd ert-components
           make targetenv_package
