name: inxware/linux_amd64-buildenv

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu:18.04

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file <target/platform/XXX/Dockerfile> --tag my-image-name:$(date +%s)
