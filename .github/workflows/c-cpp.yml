name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@v3
    - name: configure
      run: ./configure linux_x86_gtk_gst
    - uses: actions/checkout@master
       with:
          name: inxware/ert-build-support
          #ref: refs/heads/release
          lfs: true
     uses: actions/checkout@master
       with:
          name: inxware/ert-contrib-middleware
          lfs: true
    - name: make
      run: make -j 8
    - name: make check
      run: make targetenv
    - name: make distcheck
      run: make targetenv_deb
