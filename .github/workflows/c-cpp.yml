name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@v3
    - name: configure
      run: ./configure linux_x86_gtk_gst
    - name: make
      run: make prepdeps && make -j 8
    - name: make check
      run: make targetenv
    - name: make distcheck
      run: make targetenv_deb
