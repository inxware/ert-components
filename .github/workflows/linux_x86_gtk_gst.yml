name: linux_x86_gtk_gst CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux_x86_gtk_gst:

    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@main
      with:
        username: zuhaibasgher
        password: "${{ secrets.DOCKER_HUB_PASSWORD }}"
        registry: docker.pkg.github.com
        image_name: x86_gtk_gst_image
        
        
#    - uses: actions/checkout@main
    - name: "running into docker"
      run: | 
        docker build - < ./target/platform/linux_x86_gtk_gst/Dockerfile --tag x86_gtk_gst_image
        echo "Docker building complete Now run Docker image" 
        docker run -d --name x86_gtk_gst_container x86_gtk_gst_image "linux_x86"
        docker ps | grep "x86_gtk_gst_container"
        echo "Configured linux_x86_gtk_gst" 
      
