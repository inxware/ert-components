name: build-linux_android_arm64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      image: inxware/ubuntu22.04-build-essential
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        path: ert-components

    - name: Checkout ert build support repo
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
            toolchains/x86_64
            support_libs/target_libs/arm64-linux-android
        repository: inxware/ert-build-support
        fetch-depth: 1
        path: ert-build-support
        ref: refs/heads/main
        lfs: true

    - name: Checkout ert-contrib-middleware
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-contrib-middleware
        fetch-depth: 1
        path: ert-contrib-middleware
        sparse-checkout: target_libs/arm64-linux-android
        ref: refs/heads/main
        lfs: true

    - name: Checkout apps
      uses: actions/checkout@v4
      with:
        repository: inxware/apps
        fetch-depth: 1
        path: apps
        ref: refs/heads/RELEASE-PRODUCTION
        
    - name: configure
      run: |
           cd ert-components
           ./configure linux_android_arm64
    - name: make
      run: |
           cd ert-components
           pwd
           make -j 8
           
    - name: make targetenv
      run: |
           cd ert-components
           pwd
           make targetenv
           
