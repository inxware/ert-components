name: build-arduino-mbed-nano-community

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-22.04
    container:
      image: inxware/inx-arduino
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        path: ert-components

    - name: Checkout ert build support repo
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
            toolchains/x86_64
            support_libs/target_libs/arm_mbednano-arduino
        repository: inxware/ert-build-support
        path: ert-build-support
        ref: refs/heads/main
        lfs: true

    - name: Checkout ert-contrib-middleware
      uses: actions/checkout@v4
      with:
        repository: inxware/ert-contrib-middleware
        path: ert-contrib-middleware
        sparse-checkout: target_libs/arm_mbednano-arduino-arm-none-eabi
        ref: refs/heads/main
        lfs: true

    - name: Checkout apps
      uses: actions/checkout@v4
      with:
        repository: inxware/apps
        path: apps
        ref: refs/heads/RELEASE-PRODUCTION
        
    - name: configure
      run: |
           cd ert-components
           ./configure arduino_arduino-mbed-nano_community
    
    - name: make chkconfig
      run: |
           cd ert-components
           pwd
           make chkconfig

    - name: make
      run: |
           cd ert-components
           pwd
           make -j 8
           
    - name: make targetenv
      run: |
           cd ert-components
           pwd
           make targetenv
           
    - name: make package
      run: |
           cd ert-components
           pwd
           make targetenv_deb
