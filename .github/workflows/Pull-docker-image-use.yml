name: Pull-Custom-Docker-Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Using_Pulled_container:

    runs-on: ubuntu-18.04
    services: 
      degian9:
        image: zuhaibasgher/inxwaretesting
    steps:
    - uses: actions/checkout@v3
      with:
        path: ert-components
    - name: Checkout tools repo
      uses: actions/checkout@v3
      with:
        repository: inxware/ert-build-support
        path: ert-build-support
        ref: refs/heads/main
        lfs: true
    - name: Checkout contrib middleware repo
      uses: actions/checkout@v3
      with:
        repository: inxware/ert-contrib-middleware
        path: ert-contrib-middleware
        ref: refs/heads/main
        lfs: true

    - name: configure 
      run: | 
           cd ert-components
           tree -L 4 ../../
           pwd
           ./configure linux_amd64
           ps -eaf
    - name: make -j 8
      run: |
           cd ert-components
           pwd
           make targetenv
    - name: make distcheck
      run: |
           cd ert-components
           pwd
           make targetenv_deb
