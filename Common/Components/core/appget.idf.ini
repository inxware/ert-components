[Parameter3]
name=Install as Default
data type=B
default=0
description=Set the application as the Default App when it is installed.

[Parameter4]
name=Install Mode
data type=I
min range=0
max range=2
default=0
description=Install Mode, 0 install as standard App in canonical directory, 1 install as Home App, 2 install as Temp App.
